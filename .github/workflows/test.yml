name: Test

on:
  push:
    branches: master

jobs:
  forge-tests: 
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7   

      - name: Foundary Toolchain
        uses: foundary-rs/foundary-toolchain@v1

      - name: Build
        run: forge build

      - name: Run Tests
        run: forge test --isolate -vvv
        env:
          FORGE_SNAPSHOT_CHECK: true 
